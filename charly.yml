sherpa-onnx:
    candy:
        description: |
            offline text-to-speech — the sherpa-onnx ONNX engine plus a baked en_US VITS voice, no runtime download
            Downloads the sherpa-onnx shared runtime release (executables under
            runtime/bin, the ONNX Runtime + C-API shared libraries under
            runtime/lib) and the vits-piper-en_US-lessac-high voice into
            ~/.local/share/sherpa-onnx. Verifiable end to end: the offline-tts
            engine binary is present and executable, its shared libraries are in
            place, the VITS voice model + tokens ship in the image, and the baked
            voice synthesises a wav file through the exported runtime contract, so
            synthesis runs fully offline with no network fetch.
        env:
            SHERPA_ONNX_RUNTIME_DIR: "~/.local/share/sherpa-onnx/runtime"
            SHERPA_ONNX_MODEL_DIR: "~/.local/share/sherpa-onnx/models"
            SHERPA_ONNX_VITS_DATA_DIR: "~/.local/share/sherpa-onnx/models/vits-piper-en_US-lessac-high/espeak-ng-data"
        var:
            SHERPA_VERSION: v1.12.23
        plan:
            - run: mkdir=${HOME}/.local/share/sherpa-onnx/runtime
              mkdir: "${HOME}/.local/share/sherpa-onnx/runtime"
              run_as: "${USER}"
            - run: mkdir=${HOME}/.local/share/sherpa-onnx/models
              mkdir: "${HOME}/.local/share/sherpa-onnx/models"
              run_as: "${USER}"
            - run: |
                command=case "${BUILD_ARCH}" in
                  x86_64) SUFFIX="linux-x64" ;;
                  aarch64) SUFFIX="linux-aarch64" ;;
                  *) echo "Unsupported arch: ${BUILD_ARCH}"; exit 1 ;;
                esac
                curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}-${SUFFIX}-shared.tar.bz2" \
                  | tar -xjf - --strip-components=1 -C ~/.local/share/sherpa-onnx/runtime
              run_as: "${USER}"
              command: |
                case "${BUILD_ARCH}" in
                  x86_64) SUFFIX="linux-x64" ;;
                  aarch64) SUFFIX="linux-aarch64" ;;
                  *) echo "Unsupported arch: ${BUILD_ARCH}"; exit 1 ;;
                esac
                curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}-${SUFFIX}-shared.tar.bz2" \
                  | tar -xjf - --strip-components=1 -C ~/.local/share/sherpa-onnx/runtime
            - run: |
                command=curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-lessac-high.tar.bz2" \
                  | tar -xjf - -C ~/.local/share/sherpa-onnx/models
              run_as: "${USER}"
              command: |
                curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-lessac-high.tar.bz2" \
                  | tar -xjf - -C ~/.local/share/sherpa-onnx/models
            - check: the sherpa-onnx offline-tts engine binary is installed under the runtime bin dir
              file:
                file: ${HOME}/.local/share/sherpa-onnx/runtime/bin/sherpa-onnx-offline-tts
                exists: true
            - check: the offline-tts engine binary is executable
              exit_status: 0
              command: test -x ${HOME}/.local/share/sherpa-onnx/runtime/bin/sherpa-onnx-offline-tts
            - check: the sherpa-onnx C-API shared library ships under the runtime lib dir
              file:
                file: ${HOME}/.local/share/sherpa-onnx/runtime/lib/libsherpa-onnx-c-api.so
                exists: true
            - check: the bundled ONNX Runtime shared library ships alongside it so the engine can link
              file:
                file: ${HOME}/.local/share/sherpa-onnx/runtime/lib/libonnxruntime.so
                exists: true
            - check: the en_US-lessac-high VITS voice model is baked into the image for offline synthesis
              file:
                file: ${HOME}/.local/share/sherpa-onnx/models/vits-piper-en_US-lessac-high/en_US-lessac-high.onnx
                exists: true
            - check: the voice model tokens file ships next to the model
              file:
                file: ${HOME}/.local/share/sherpa-onnx/models/vits-piper-en_US-lessac-high/tokens.txt
                exists: true
            - check: the espeak-ng phoneme data the baked VITS voice speaks through ships next to the model
              id: vits-espeak-data
              file:
                file: ${HOME}/.local/share/sherpa-onnx/models/vits-piper-en_US-lessac-high/espeak-ng-data
                exists: true
            # Brace-less refs on purpose: charly's check-var resolver scans `${IDENT}`
            # and skips a step whose variable it cannot resolve in the build context, so
            # `${SHERPA_ONNX_VITS_DATA_DIR}` here would turn this check into a silent
            # skip. Brace-less the shell reads the container's exported env — and an
            # absent export fails the check instead of skipping it.
            - check: the baked VITS voice synthesises a wav file through the exported runtime contract
              id: vits-synthesis
              exit_status: 0
              command: |
                OUT=/tmp/charly-sherpa-onnx-synthesis.wav
                rm -f "$OUT"
                "$SHERPA_ONNX_RUNTIME_DIR/bin/sherpa-onnx-offline-tts" \
                  --vits-model="$SHERPA_ONNX_MODEL_DIR/vits-piper-en_US-lessac-high/en_US-lessac-high.onnx" \
                  --vits-tokens="$SHERPA_ONNX_MODEL_DIR/vits-piper-en_US-lessac-high/tokens.txt" \
                  --vits-data-dir="$SHERPA_ONNX_VITS_DATA_DIR" \
                  --output-filename="$OUT" \
                  "charly sherpa-onnx synthesis check"
                test -s "$OUT"
                [ "$(head -c 4 "$OUT")" = "RIFF" ]
            - check: file=${HOME}/.local/share/sherpa-onnx/runtime/bin/sherpa-onnx
              id: sherpa-onnx-cli-binary
              file:
                file: ${HOME}/.local/share/sherpa-onnx/runtime/bin/sherpa-onnx
                exists: true

sherpa-onnx-skill:
    skill:
        name: sherpa-onnx
        family: tools
        owner: sherpa-onnx
        description: |-
            sherpa-onnx offline text-to-speech.
            Use when working with the sherpa-onnx candy.
        content: |
            # sherpa-onnx -- Offline TTS
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (`run:` step) |
            | Depends | none |
            
            ## Environment
            
            | Variable | Value |
            |----------|-------|
            | `SHERPA_ONNX_RUNTIME_DIR` | `~/.local/share/sherpa-onnx/runtime` |
            | `SHERPA_ONNX_MODEL_DIR` | `~/.local/share/sherpa-onnx/models` |
            | `SHERPA_ONNX_VITS_DATA_DIR` | `~/.local/share/sherpa-onnx/models/vits-piper-en_US-lessac-high/espeak-ng-data` |
            
            ## Usage
            
            ```yaml
            # box charly.yml — compose the candy as an inline list in the box body
            my-box:
              candy:
                base: fedora
                candy: [sherpa-onnx]
            ```
            
            ## Synthesise Speech
            
            The baked `vits-piper-en_US-lessac-high` voice synthesises offline. Every option
            takes the `=` form, and `--vits-data-dir` is required: the piper voice speaks
            espeak-ng phonemes, so leaving it empty exits 255 with `Not a model using
            characters as modeling unit`. The candy exports that data dir, so the invocation
            below works with nothing but the installed runtime:
            
            ```bash
            ~/.local/share/sherpa-onnx/runtime/bin/sherpa-onnx-offline-tts \
              --vits-model=$SHERPA_ONNX_MODEL_DIR/vits-piper-en_US-lessac-high/en_US-lessac-high.onnx \
              --vits-tokens=$SHERPA_ONNX_MODEL_DIR/vits-piper-en_US-lessac-high/tokens.txt \
              --vits-data-dir=$SHERPA_ONNX_VITS_DATA_DIR \
              --output-filename=/tmp/out.wav "hello"
            ```
            
            The candy's `plan:` runs that same invocation as a `check:`, so a voice that
            cannot synthesise fails the plan instead of passing every check.
            
            ## Used In Boxes
            
            
            ## Related Candies
            - `/charly-tools:whisper` -- speech-to-text counterpart
            - `/charly-tools:sag` -- ElevenLabs TTS alternative
            
            ## Related Commands
            - `/charly-core:shell` -- run sherpa-onnx CLI inside the container
            - `/charly-automation:openclaw-deploy` -- TTS skill registration in OpenClaw
            
            ## When to Use This Skill
            
            Use when the user asks about:
            - Offline text-to-speech
            - sherpa-onnx TTS engine
            - ONNX-based speech synthesis
            - The `sherpa-onnx` candy
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, plan-step verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)
